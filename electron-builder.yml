appId: com.gustavo.pixelcreator
productName: PixelCreator
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!public/**'
  - '!scripts/**'
  - '!vitest.config.mjs'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
win:
  executableName: pixelcreator
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  target:
    - dmg
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: resources/icono_pc.png
  syncDesktopName: true
  target:
    - AppImage
    - deb
    - snap
  maintainer: Gustavo Garrido <gustavogarrido.programador@gmail.com>
  category: Graphics
snap:
  base: core22
  confinement: strict
  grade: stable
  summary: Convierte imágenes en plantillas de beads (Hama, Perler)
  description: >-
    Convierte cualquier imagen en una plantilla para beads de plancha (Hama, Perler, Nabbi y
    Artkal) con los colores y códigos reales del fabricante. Recorta a la cuadrícula del
    tablero, edita celdas a mano y exporta PNG, PDF por tableros y la lista de compra en CSV.
  allowNativeWayland: true
  # Solo los permisos que la app necesita (la tienda los revisa)
  plugs:
    - desktop
    - desktop-legacy
    - home
    - x11
    - wayland
    - unity7
    - browser-support
    - network
    - gsettings
    - opengl
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
